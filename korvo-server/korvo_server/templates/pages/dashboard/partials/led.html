<div class="tab-panel" role="tabpanel" id="tab-led" aria-labelledby="tabbtn-led">
    <!-- LED Control -->
    <div class="card" id="ledCard">
      <h2>
        <span class="icon">💡</span> LED Control
        <span class="badge disconnected" id="ledBadge">Board offline</span>
      </h2>

      <div class="led-layout">
        <div class="led-col led-col-presets">
          <div class="led-power-callout">
            <label class="led-section-label">Power</label>
            <button type="button" class="btn-primary flash-action-btn led-power-hero-btn" id="ledPowerBtn" onclick="toggleLed()" title="Toggle LED power">OFF</button>
          </div>
          <label class="led-section-label">Presets</label>
          <div class="led-presets">
            <button type="button" class="btn-secondary" onclick="ledPreset(1)" title="Solid using current custom color"><span class="led-preset-emoji">⬤</span> Solid</button>
            <button type="button" class="btn-secondary" onclick="ledPreset(2)" title="Single rotating head with short trail"><span class="led-preset-emoji">↻</span> Spinner</button>
            <button type="button" class="btn-secondary" onclick="ledPreset(15)" title="Spinner in reverse direction"><span class="led-preset-emoji">↺</span> Spinner flip</button>
            <button type="button" class="btn-secondary" onclick="ledPreset(3)" title="Forward rainbow cycle around the ring"><span class="led-preset-emoji">🌈</span> Rainbow</button>
            <button type="button" class="btn-secondary" onclick="ledPreset(12)" title="Rainbow in reverse direction"><span class="led-preset-emoji">🪄</span> Rainbow flip</button>
            <button type="button" class="btn-secondary" onclick="ledPreset(4)" title="Pulse brightness in and out"><span class="led-preset-emoji">💨</span> Breathe</button>
            <button type="button" class="btn-secondary" onclick="ledPreset(10)" title="Pulse current strip colors"><span class="led-preset-emoji">💓</span> Pulse</button>
            <button type="button" class="btn-secondary" onclick="ledPreset(11)" title="Fade across current strip colors"><span class="led-preset-emoji">🌫</span> Fade</button>
            <button type="button" class="btn-secondary" onclick="ledPreset(13)" title="Random sparkles on current color"><span class="led-preset-emoji">✨</span> Sparkle</button>
            <button type="button" class="btn-secondary" onclick="ledPreset(14)" title="Bright moving head with a longer fading tail"><span class="led-preset-emoji">☄</span> Comet</button>
            <button type="button" class="btn-secondary" onclick="ledRandomizeStrip()" title="Paint every LED with a random color"><span class="led-preset-emoji">🎲</span> Randomize</button>
          </div>
        </div>

        <div class="led-col led-col-ring">
          <div class="led-ring-stage">
            <div class="led-brightness-rail">
              <span class="led-brightness-value" id="brightnessVal">12</span>
              <input type="range" id="ledBrightness" min="0" max="255" value="12" class="led-brightness-vertical" aria-label="LED brightness">
            </div>
            <div id="ledRingPreview" class="led-ring" role="group" aria-label="LED ring — tap a pixel to paint or tap again to clear"></div>
          </div>
          <p class="led-help led-ring-help">Click a dot above to switch that LED on/off.</p>
          <div class="btn-row led-ring-actions">
            <label class="btn-secondary led-custom-picker-btn" id="ledCustomPickerBtn" title="Custom color picker">
              <span class="led-custom-picker-text">Pick Colour</span>
              <input type="color" id="ledColor" value="#0096ff" class="led-color-input led-color-input-overlay" aria-label="Custom LED color">
            </label>
            <button type="button" class="btn-secondary" onclick="ledPushFullStrip()" title="Apply the custom color to all LEDs">Apply all</button>
          </div>
        </div>

        <div class="led-col led-col-solid">
          <label class="led-section-label">Solid colors</label>
          <div class="led-swatches">
            <button type="button" class="btn-secondary led-named" id="ledTogRed" onclick="ledNamedToggle(255,0,0)" style="background:#3e2723;color:#ff5722">Red</button>
            <button type="button" class="btn-secondary led-named" id="ledTogGreen" onclick="ledNamedToggle(0,255,0)" style="background:#1a472a;color:#4caf50">Green</button>
            <button type="button" class="btn-secondary led-named" id="ledTogBlue" onclick="ledNamedToggle(0,100,255)" style="background:#1a237e;color:#64b5f6">Blue</button>
            <button type="button" class="btn-secondary led-named" id="ledTogCyan" onclick="ledNamedToggle(0,255,255)" style="background:#004d4d;color:#80deea">Cyan</button>
            <button type="button" class="btn-secondary led-named" id="ledTogMagenta" onclick="ledNamedToggle(255,0,255)" style="background:#4a144a;color:#f48fb1">Magenta</button>
            <button type="button" class="btn-secondary led-named" id="ledTogOrange" onclick="ledNamedToggle(255,150,0)" style="background:#4a2f00;color:#ff9800">Orange</button>
            <button type="button" class="btn-secondary led-named" id="ledTogYellow" onclick="ledNamedToggle(255,220,0)" style="background:#4a3d00;color:#ffeb3b">Yellow</button>
            <button type="button" class="btn-secondary led-named" id="ledTogPink" onclick="ledNamedToggle(255,105,180)" style="background:#4a1a30;color:#f8bbd0">Pink</button>
            <button type="button" class="btn-secondary led-named" id="ledTogPurple" onclick="ledNamedToggle(128,0,255)" style="background:#2d1a4a;color:#ce93d8">Purple</button>
            <button type="button" class="btn-secondary led-named" id="ledTogLime" onclick="ledNamedToggle(180,255,0)" style="background:#2d3d00;color:#dce775">Lime</button>
            <button type="button" class="btn-secondary led-named" id="ledTogTeal" onclick="ledNamedToggle(0,128,128)" style="background:#003d3d;color:#4db6ac">Teal</button>
            <button type="button" class="btn-secondary led-named" id="ledTogCoral" onclick="ledNamedToggle(255,127,80)" style="background:#4a2518;color:#ffab91">Coral</button>
            <button type="button" class="btn-secondary led-named" id="ledTogWhite" onclick="ledNamedToggle(255,255,255)" style="background:#555;color:#eee">White</button>
            <button type="button" class="btn-secondary led-named" id="ledTogWarm" onclick="ledNamedToggle(255,200,120)" style="background:#4a3520;color:#ffe0b2">Warm</button>
          </div>
          <p class="led-help">(tap again to turn off)</p>
        </div>

      </div>
    </div>
    </div>
