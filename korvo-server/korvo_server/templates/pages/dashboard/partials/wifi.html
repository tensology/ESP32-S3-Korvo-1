<div class="tab-panel active" role="tabpanel" id="tab-wifi" aria-labelledby="tabbtn-wifi">
    <!-- WiFi Setup -->
    <div class="card">
      <h2>
        <span class="icon">📶</span> WiFi Network
      </h2>
      <div class="row">
        <div class="field" style="flex:2">
          <label>SSID</label>
          <input type="text" id="ssid" list="ssidList" placeholder="Select from saved or type manually">
          <datalist id="ssidList"></datalist>
        </div>
        <div class="field" style="flex:1">
          <label>&nbsp;</label>
          <div style="display:flex;gap:0.45rem;">
            <button class="btn-secondary" onclick="scanNetworks()" id="scanBtn">Scan</button>
            <button class="btn-secondary" onclick="testWifiConnection()" id="testWifiBtn">Test Board</button>
          </div>
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <input type="password" id="password" placeholder="WiFi password" style="flex:1;">
          <button
            type="button"
            class="btn-secondary"
            id="wifiPasswordToggleBtn"
            onclick="toggleWifiPasswordVisibility()"
            aria-pressed="false"
            aria-label="Show WiFi password"
          >
            Show
          </button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="saveWifi()">Save & Set Active</button>
        <button class="btn-secondary" onclick="syncWifiToBoard()">Sync Saved Networks to ESP32</button>
      </div>
      <div id="wifiRuntimeStatus" style="margin-top:0.75rem;font-size:0.8rem;color:#888;">Board status: unknown</div>
      <div id="scanResults" style="display:none; margin-top: 1rem;">
        <label>Available Networks</label>
        <ul class="network-list" id="networkList"></ul>
      </div>
      <div class="saved-networks" id="savedNetworks" style="display:none">
        <label style="margin-top:1rem">Saved Networks</label>
        <div id="savedList"></div>
      </div>
    </div>
    </div>
