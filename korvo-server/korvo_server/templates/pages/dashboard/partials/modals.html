  <!-- Boot Mode Modal -->
  <div class="modal-overlay" id="bootModal">
    <div class="modal" id="bootModalContent">
      <h3>Enter download mode</h3>
      <div class="subtitle">Firmware needs the board in bootloader mode</div>
      <div class="timer" id="bootTimer">8</div>
      <div class="instructions">
        <div class="step">
          <span class="step-num">1</span>
          <span>Hold <strong>BOOT</strong> button</span>
        </div>
        <div class="step">
          <span class="step-num">2</span>
          <span>Press & release <strong>RESET</strong> button</span>
        </div>
        <div class="step">
          <span class="step-num">3</span>
          <span>Release <strong>BOOT</strong> button</span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
